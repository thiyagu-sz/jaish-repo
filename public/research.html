<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research - ResearchAI</title>
  <meta name="description" content="Search research papers and get AI-assisted summaries, research gaps and research ideas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">RA</span>
        ResearchAI
      </a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="research.html" class="active">Research</a>
        <a href="index.html#about">About</a>
      </nav>
      <a class="btn btn-sm header-cta" href="https://github.com" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub
      </a>
    </div>
  </header>

  <!-- ------------------------------------------------------ search + filters -->
  <section class="search-bar-wrap">
    <div class="container">
      <form class="search-form" id="search-form">
        <label class="search-field compact" for="query">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="9" cy="9" r="6" /><path d="m14 14 4 4" stroke-linecap="round" />
          </svg>
          <input
            id="query"
            name="q"
            type="text"
            autocomplete="off"
            placeholder="Search a research topic, question, or technology..."
            aria-label="Search a research topic, question, or technology"
          />
        </label>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>

      <div class="filters">
        <div class="filter">
          <label for="filter-source">Source</label>
          <select id="filter-source">
            <option value="all">All</option>
            <option value="openalex">OpenAlex</option>
            <option value="semanticscholar">Semantic Scholar</option>
            <option value="arxiv">arXiv</option>
          </select>
        </div>

        <div class="filter">
          <label for="filter-year">Year</label>
          <select id="filter-year">
            <option value="">Any</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
          </select>
        </div>

        <div class="filter">
          <label for="filter-sort">Sort</label>
          <select id="filter-sort">
            <option value="relevance">Relevance</option>
            <option value="newest">Newest</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- ---------------------------------------------------------------- results -->
  <main class="container">
    <div class="results-head" id="results-head" hidden>
      <div>
        <h2 id="results-title">Results</h2>
        <p class="results-count" id="results-count"></p>
      </div>
      <span class="badge-demo" id="demo-badge" hidden>Demo Mode</span>
    </div>

    <div id="banner-slot"></div>
    <div id="results" class="paper-list" aria-live="polite"></div>
  </main>

  <!-- ----------------------------------------------------------- paper detail -->
  <div class="overlay" id="overlay" hidden></div>

  <aside class="detail-panel" id="detail-panel" aria-hidden="true" aria-label="Paper detail">
    <div class="detail-header">
      <span>Paper detail</span>
      <button class="icon-btn" id="close-detail" type="button" aria-label="Close paper detail">&times;</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </aside>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>ResearchAI - An AI-powered research discovery assistant.</span>
      <span>Prototype for academic use. Verify all results independently.</span>
    </div>
  </footer>

  <script src="js/ui.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
